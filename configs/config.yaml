# ImageForensics AI — master configuration
# Every path/hyperparameter used by src/ code should be read from here
# (via src/config.py), never hardcoded inline in scripts.

project:
  name: "image-forensics-ai"
  seed: 42                       # global reproducibility seed (numpy/torch/random)

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_metadata: "data/metadata/metadata.csv"
  models_dir: "models"
  runs_dir: "runs"                # training logs / checkpoints / metrics per experiment

data:
  image_size: 224                 # ResNet-18 standard input size
  batch_size: 32
  num_workers: 2                  # keep low — Colab/Kaggle free tier CPU cores are limited
  val_split: 0.15
  test_split: 0.15                # remainder is train
  # Dataset: GenImage subset (kaggle.com/datasets/renhuang8/genimage-subset-detection).
  # License NOT independently verified here — confirm on the dataset's Kaggle
  # page before publishing the README's license section.
  # Real: 6000 images. AI: sd_pool 5000, gan_pool 500, mj_pool 500.
  dataset_name: "GenImage (subset)"
  dataset_source_url: "https://www.kaggle.com/datasets/renhuang8/genimage-subset-detection"
  dataset_license: null     # fill in after verifying on Kaggle
  generator_families: ["stable_diffusion", "gan", "midjourney"]
  held_out_generator: "gan"  # smallest of the two candidate held-out pools (500 vs 500,
                              # tied on size) but the more meaningful generalization test:
                              # train on two diffusion-family generators (sd, midjourney),
                              # test on a different generation architecture entirely (GAN)

model:
  backbone: "resnet18"
  pretrained: true
  num_classes: 2                  # REAL=0, AI_GENERATED=1 (fixed mapping — see src/data)
  dropout: 0.3

training:
  epochs: 20
  learning_rate: 0.0003
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  early_stopping_patience: 5
  amp: true                       # mixed precision — helps on free Colab GPU tier

ablation:
  configs: ["rgb_only", "rgb_fft", "rgb_residual", "full_fusion"]

calibration:
  method: "temperature_scaling"
  n_bins_ece: 15

robustness:
  jpeg_quality_levels: [30, 60, 85]
  resize_scale: 0.5
  crop_fraction: 0.8
  blur_kernel: 5
  noise_std: 0.05

serving:
  api_host: "0.0.0.0"
  api_port: 8000
  max_upload_mb: 10
  allowed_extensions: [".jpg", ".jpeg", ".png", ".webp"]
